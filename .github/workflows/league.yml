name: league

on:
  schedule:
    - cron: "0 21 * * 4"     # Thu 21:00 UTC: before Thursday Night Football
    - cron: "0 15 * * 6"     # Sat 15:00 UTC: injury-report refresh
    - cron: "45 15 * * 0"    # Sun 15:45 UTC: after inactives, before 1pm ET games
    - cron: "45 19 * * 0"    # Sun 19:45 UTC: before late games
    - cron: "0 22 * * 1"     # Mon 22:00 UTC: before Monday Night Football
    - cron: "0 12 * * 2,3"   # Tue/Wed 12:00 UTC: grade the finished week
  workflow_dispatch:
    inputs:
      task:
        description: "lineups or grade"
        default: lineups

concurrency:
  group: league
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTINO_API_KEY: ${{ secrets.FASTINO_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      GLIFAN_MODEL: ${{ vars.GLIFAN_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch data
        run: FIRST_SEASON=2021 bash pipeline/fetch_data.sh
      - name: Pick task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "0 12 * * 2,3" ]; then echo "task=grade" >> "$GITHUB_OUTPUT";
          else echo "task=lineups" >> "$GITHUB_OUTPUT"; fi
      - name: Run
        run: |
          python pipeline/league.py ${{ steps.task.outputs.task }} || echo "::warning::league ${{ steps.task.outputs.task }} exited non-zero"
          python pipeline/league.py grade
          python pipeline/league.py publish
      - name: Commit
        run: |
          git config user.name "glifan-bot"
          git config user.email "glifan-bot@users.noreply.github.com"
          git add league web/public/data/league
          git diff --cached --quiet || git commit -m "league: ${{ steps.task.outputs.task }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Deploy (only needed while the Vercel Git integration isn't connected)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        if: env.VERCEL_TOKEN != ''
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
